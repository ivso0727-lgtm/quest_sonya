
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Справа № 07 — Остання підказка</title>
<style>
:root {
  --bg: #10131c;
  --panel: #1b2030;
  --gold: #f4c76b;
  --text: #f4f1e9;
  --muted: #b5b8c7;
  --red: #f17878;
  --green: #8ce0b0;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  background:
    radial-gradient(ellipse at top, #30354c 0%, transparent 60%),
    var(--bg);
  font-family: Georgia, "Times New Roman", serif;
}
header {
  padding: 30px 18px 18px;
  text-align: center;
  border-bottom: 1px solid #ffffff18;
}
.eyebrow {
  color: var(--gold);
  text-transform: uppercase;
  letter-spacing: 4px;
  font: 12px Arial, sans-serif;
}
h1 { font-size: clamp(28px, 6vw, 46px); margin: 14px 0 8px; }
header p { color: var(--muted); margin: 0; }
main { width: min(760px, 92%); margin: 25px auto 60px; }
.progress-wrap { margin-bottom: 22px; }
.progress-label {
  display: flex; justify-content: space-between;
  color: var(--muted); font: 12px Arial, sans-serif;
  margin-bottom: 8px;
}
.progress { height: 5px; background: #ffffff18; border-radius: 10px; overflow: hidden; }
#progressBar { height: 100%; width: 0; background: var(--gold); transition: width .3s; }
.card {
  background: #1b2030ef;
  border: 1px solid #ffffff1b;
  border-radius: 18px;
  padding: clamp(20px, 5vw, 34px);
  box-shadow: 0 18px 60px #0004;
}
.stage-tag {
  color: var(--gold); font: 12px Arial, sans-serif;
  letter-spacing: 2px; text-transform: uppercase;
}
h2 { font-size: 28px; margin: 12px 0; }
p, li { line-height: 1.7; }
.muted { color: var(--muted); }
.clue {
  background: #0e111a; border-left: 3px solid var(--gold);
  border-radius: 8px; padding: 16px; margin: 18px 0;
  line-height: 1.7; white-space: pre-line;
}
button, input {
  font: 16px Arial, sans-serif; border-radius: 10px;
}
button {
  padding: 13px 17px; border: 1px solid #ffffff24;
  background: #2b3247; color: var(--text);
  cursor: pointer; transition: .2s;
}
button:hover { border-color: var(--gold); transform: translateY(-1px); }
button.primary { background: var(--gold); color: #211a0d; border-color: var(--gold); font-weight: bold; }
.choices { display: grid; gap: 10px; margin: 20px 0; }
.choices button { text-align: left; }
input {
  width: 100%; padding: 14px; color: var(--text);
  background: #10131c; border: 1px solid #ffffff35;
  margin: 8px 0 12px;
}
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
.feedback { min-height: 24px; margin-top: 12px; color: var(--gold); }
footer { text-align: center; color: #888da0; padding: 0 20px 28px; font: 12px Arial, sans-serif; }
.heart { color: #ff8a9a; }
</style>
</head>
<body>
<header>
  <div class="eyebrow">Закрита справа · Архів № 07</div>
  <h1>Остання підказка</h1>
  <p>Детективна історія, головна героїня якої — Соня.</p>
</header>

<main>
  <div class="progress-wrap">
    <div class="progress-label">
      <span id="progressText">Матеріали справи</span>
      <span id="progressCount">0 / 6</span>
    </div>
    <div class="progress"><div id="progressBar"></div></div>
  </div>
  <section class="card" id="game"></section>
</main>
<footer>Створено з <span class="heart">♥</span> спеціально для Соні</footer>

<script>
const stages = [
{
  tag: "Етап 01 · Місце події",
  title: "Зникнення подарунка",
  text: "Соню, у нас надзвичайна подія! Подарунок, приготований спеціально для тебе, зник із замкненої кімнати. На столі залишилася записка, а на підлозі — сліди. Лише уважна детективка зможе розкрити цю справу.",
  clue: "ПРОТОКОЛ ОГЛЯДУ\n\n• Вікно зачинене зсередини.\n• Двері не пошкоджені.\n• На столі лежить записка: «Шукай там, де зберігаються слова».\n• Годинник зупинився на 07:27.",
  question: "Де найрозумніше шукати наступну підказку?",
  choices: ["У книжковій шафі", "У морозильнику", "Під килимком надворі"],
  correct: 0,
  success: "Правильно! Книжки зберігають слова. Серед них знайдено конверт зі свідченнями."
},
{
  tag: "Етап 02 · Допит свідків",
  title: "Три свідчення",
  text: "Кімнату відвідали троє людей. Кожен залишив свої свідчення. Уважно прочитай їх і знайди підозрілу деталь.",
  clue: "АННА: «Я пішла ще до сьомої й навіть не підходила до столу».\n\nМАКС: «О 19:10 я бачив світло в кімнаті, але всередину не заходив».\n\nЛЕО: «Я взагалі не був у будинку, бо в цей час ішов дощ. Моя куртка зовсім суха».",
  question: "Чиї свідчення викликають найбільше запитань?",
  choices: ["Анни", "Макса", "Лео"],
  correct: 2,
  success: "Чудове спостереження! Суха куртка після прогулянки під дощем — дивна деталь. Але це ще не доказ."
},
{
  tag: "Етап 03 · Зашифроване послання",
  title: "Шифр Цезаря",
  text: "У конверті лежала ще одна записка. Кожну літеру змістили на три позиції вперед за українською абеткою. Щоб прочитати послання, змісти кожну літеру на три позиції назад.",
  clue: "КЛЮЧ: зсув −3\n\nЗАШИФРОВАНИЙ ТЕКСТ: НОБЬ",
  question: "Яке слово було зашифровано?",
  input: true,
  placeholder: "Введи слово",
  accepted: ["КЛЮЧ"],
  hint: "Спробуй застосувати зсув на три літери назад за українською абеткою.",
  success: "Послання вказує на ключ! У кишені старого пальта справді знайшли маленький ключ із биркою «07»."
},
{
  tag: "Етап 04 · Версія слідства",
  title: "Хто винен?",
  text: "Маємо три факти: Лео дав сумнівні свідчення, ключ знайшли в пальті, а записка вказувала на місце, де зберігаються слова. Але пам’ятай: підозра — це ще не доказ.",
  clue: "У матеріалах справи немає прямих доказів проти Анни, Макса чи Лео. Натомість відомо, що вся історія була влаштована заради сюрпризу для Соні.",
  question: "Яку версію обираєш?",
  choices: ["Лео все організував", "Це була ретельно підготовлена загадка", "Доказів поки недостатньо"],
  correct: 1,
  success: "Саме так! Це не справжній злочин, а загадка із сюрпризом. Хтось хотів, щоб Соня відчула себе героїнею детективної історії."
},
{
  tag: "Етап 05 · Сейф",
  title: "Код останнього замка",
  text: "Ключ відімкнув маленьку металеву скриньку. Усередині — замок із цифровим кодом і коротка записка.",
  clue: "«Почни з номера справи. Додай число, яке було на годиннику на самому початку».\n\nНомер справи: 07\nЧас на годиннику: 07:27",
  question: "Введи код із чотирьох цифр.",
  input: true,
  placeholder: "Наприклад, 0727",
  accepted: ["0727"],
  hint: "Згадай час на годиннику, що зупинився: 07:27.",
  success: "Клац! Сейф відчинився. Усередині лежить останній лист — адресований особисто тобі."
},
{
  tag: "Етап 06 · Фінал",
  title: "Справу розкрито",
  text: "Соню, ти пройшла всі випробування: помітила деталі, перевірила свідчення, розгадала шифр і відкрила сейф. Залишилася остання підказка — та, яку неможливо знайти під лупою.",
  clue: "НАЙВАЖЛИВІШЕ ПОСЛАННЯ\n\nТи — людина, заради якої захотілося вигадати цілу історію. Дякую за твою усмішку, твій характер і за всі моменти, які роблять життя особливим.",
  question: "Готова забрати свою нагороду?",
  choices: ["Відкрити фінальне послання ♥"],
  correct: 0,
  ending: true
}
];

let current = 0;
let solved = new Set();

const game = document.getElementById("game");

function render() {
  const s = stages[current];
  document.getElementById("progressText").textContent = "Матеріали справи";
  document.getElementById("progressCount").textContent = solved.size + " / 6";
  document.getElementById("progressBar").style.width = (solved.size / 6 * 100) + "%";

  game.innerHTML = `
    <div class="stage-tag">${s.tag}</div>
    <h2>${s.title}</h2>
    <p>${s.text}</p>
    <div class="clue">${s.clue}</div>
    <p><strong>${s.question}</strong></p>
    <div id="answerArea"></div>
    <div class="feedback" id="feedback"></div>
    <div class="actions" id="actions"></div>
  `;

  const answerArea = document.getElementById("answerArea");
  const actions = document.getElementById("actions");

  if (s.input) {
    answerArea.innerHTML = `<input id="answerInput" placeholder="${s.placeholder}" autocomplete="off">`;
    const check = document.createElement("button");
    check.className = "primary";
    check.textContent = "Перевірити";
    check.onclick = checkInput;
    actions.appendChild(check);

    const hint = document.createElement("button");
    hint.textContent = "Підказка";
    hint.onclick = showHint;
    actions.appendChild(hint);

    document.getElementById("answerInput").addEventListener("keydown", e => {
      if (e.key === "Enter") checkInput();
    });
  } else {
    const choices = document.createElement("div");
    choices.className = "choices";
    s.choices.forEach((choice, i) => {
      const button = document.createElement("button");
      button.textContent = choice;
      button.onclick = () => choose(i);
      choices.appendChild(button);
    });
    answerArea.appendChild(choices);
  }
}

function choose(index) {
  const s = stages[current];
  const feedback = document.getElementById("feedback");

  if (index !== s.correct) {
    feedback.textContent = "Не зовсім. Переглянь докази ще раз і спробуй знову.";
    feedback.style.color = "var(--red)";
    return;
  }

  solved.add(current);

  if (s.ending) {
    showEnding();
    return;
  }

  feedback.textContent = s.success;
  feedback.style.color = "var(--green)";
  nextButton();
}

function checkInput() {
  const s = stages[current];
  const value = document.getElementById("answerInput").value.trim().toUpperCase().replace(/\s/g, "");
  const feedback = document.getElementById("feedback");

  if (s.accepted.includes(value)) {
    solved.add(current);
    feedback.textContent = s.success;
    feedback.style.color = "var(--green)";
    nextButton();
  } else {
    feedback.textContent = "Відповідь не підійшла. Перевір записку й спробуй ще раз.";
    feedback.style.color = "var(--red)";
  }
}

function showHint() {
  const s = stages[current];
  document.getElementById("feedback").textContent = s.hint;
}

function nextButton() {
  const actions = document.getElementById("actions");
  if (document.getElementById("nextBtn")) return;

  const next = document.createElement("button");
  next.id = "nextBtn";
  next.className = "primary";
  next.textContent = current === stages.length - 1 ? "Завершити справу" : "Наступна підказка →";

  next.onclick = () => {
    if (current === stages.length - 1) showEnding();
    else {
      current++;
      render();
    }
  };

  actions.appendChild(next);
}

function showEnding() {
  solved.add(current);
  document.getElementById("progressCount").textContent = "6 / 6";
  document.getElementById("progressBar").style.width = "100%";

  game.innerHTML = `
    <div class="stage-tag">Справу закрито · Архів № 07</div>
    <h2>Для тебе, Соню ♥</h2>
    <p>Ти розкрила справу! Але головний секрет увесь цей час був зовсім не в доказах.</p>
    <div class="clue">Ти робиш цей світ трішечки кращим просто тим, що ти в ньому є.\n\nНехай попереду буде ще багато щасливих митей, маленьких пригод і приводів усміхатися.\n\nЦю справу закрито. Але наша історія триває… ♥</div>
    <p class="muted">Нагорода за проходження: одні великі обійми й сюрприз від автора цього квесту.</p>
    <div class="actions">
      <button class="primary" onclick="restart()">Пройти ще раз ↻</button>
    </div>
  `;
}

function restart() {
  current = 0;
  solved = new Set();
  render();
}

render();
</script>
</body>
</html>
